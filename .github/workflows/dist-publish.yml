name: "Publish Action on tag creation"

on:
  push:
  release:
    types:
      - published

jobs:
  lint-action:
    name: "Lint Action for syntax"
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Install dependencies"
        run: npm ci

      - name: "Run linting"
        run: npm run lint

  tag-release:
    name: "Create release from tag"
    runs-on: ubuntu-slim

    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}

    needs:
      - lint-action

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Publish
        id: publish
        uses: actions/publish-immutable-action@4bc8754ffc40f27910afb20287dbbbb675a4e978 # v0.0.4
